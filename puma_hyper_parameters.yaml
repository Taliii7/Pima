imports:
  - $import os

# seed: 28022024 # uncommend for deterministic results (but slower)
seed: null

bundle_root: "."
ckpt_path: $os.path.join(@bundle_root, "models/puma")  # dossier dédié PUMA → évite d'écraser les checkpoints CytoDArk
output_dir: $os.path.join(@bundle_root, "eval/puma")   # logs et events séparés aussi
log_output_file: $os.path.join(@output_dir, "vista_puma.log")

mlflow_tracking_uri: null
mlflow_log_system_metrics: true
mlflow_run_name: null

ckpt_save: true
amp: true
amp_dtype: "float16"
channels_last: true
compile: false

start_epoch: 0
run_final_testing: true
use_weighted_sampler: false

pretrained_ckpt_name: null
pretrained_ckpt_path: "./models/model.pt"  # point de départ : meilleur modèle CytoDArk (epoch 4, acc=0.7525)

# for commandline setting of a single dataset
datalist: datalists/puma_datalist.json
basedir: ../puma_data_converted
data_list_files:
  - {datalist: "@datalist", basedir: "@basedir"}


fold: 0
learning_rate: 0.0001
quick: false
roi_size: [256, 256]

train:
  skip: false
  handlers: []
  trainer:
    num_warmup_epochs: 3
    max_epochs: 70
    num_epochs_per_saving: 5
    num_epochs_per_validation: 5
  num_workers: 4
  batch_size: 2
  dataset:
    preprocessing:
      roi_size: "@roi_size"
    data:
      key: "validation"
      data_list_files: "@data_list_files"

dataset:
  data:
    key: "validation"
    data_list_files: "@data_list_files"

validate:
  grouping: true
  evaluator:
    postprocessing: "@postprocessing"
  dataset:
    data: "@dataset#data"
  batch_size: 1
  num_workers: 4
  preprocessing: "@train#dataset#preprocessing"
  postprocessing: null
  inferer: "@inferer#sliding_inferer"
  handlers: null
  key_metric: "@key_metric"

infer:
  evaluator:
    postprocessing: "@postprocessing"
  dataset:
    data: "@dataset#data"


device: "$torch.device(('cuda:' + os.environ.get('LOCAL_RANK', '0')) if torch.cuda.is_available() else 'cpu')"
network_def:
  _target_: scripts.cell_sam_wrapper.CellSamWrapper
  checkpoint: $os.path.join(@bundle_root, "models/sam_vit_b_01ec64.pth")  # chemin absolu depuis bundle_root
network: $@network_def.to(@device)

loss_function:
  _target_: scripts.components.CellLoss

key_metric:
  _target_: scripts.components.CellAcc


optimizer:
  _target_: torch.optim.AdamW
  params: $@network.parameters()
  lr: "@learning_rate"
  weight_decay: 1.0e-5

lr_scheduler:
  _target_: monai.optimizers.lr_scheduler.WarmupCosineSchedule
  optimizer: "@optimizer"
  warmup_steps: "@train#trainer#num_warmup_epochs"
  warmup_multiplier: 0.1
  t_total: "@train#trainer#max_epochs"

inferer:
  sliding_inferer:
    _target_: monai.inferers.SlidingWindowInfererAdapt
    roi_size: "@roi_size"
    sw_batch_size: 1
    overlap: 0.5
    mode: "gaussian"
    cache_roi_weight_map: true
    progress: false

image_saver:
  _target_: scripts.components.SaveTiffd
  keys: "seg"
  output_dir: "@output_dir"
  nested_folder: false

postprocessing:
  _target_: monai.transforms.Compose
  transforms:
    - "@image_saver"
